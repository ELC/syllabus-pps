name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /syllabus-pps/
      ANALYTICS_BASE: /syllabus-pps/analytics/
      NETWORK_BASE: /syllabus-pps/network/
      ROADMAP_BASE: /syllabus-pps/roadmap/
      CMS_BASE: /syllabus-pps/cms/
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: Sync from Supabase (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            pnpm build:core
            pnpm --filter @pps/analytics-cli build
            pnpm --filter @pps/analytics-cli exec node dist/src/cli/bin/cli.js sync-pull
          fi
        continue-on-error: true

      - run: pnpm build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
